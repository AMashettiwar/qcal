name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy: {matrix: {os: [ubuntu-latest, windows-latest], python: ["3.11", "3.12"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .[dev]
      - run: python -m pytest -q tests/test_qcal.py tests/test_api.py tests/test_hardening.py tests/test_stress.py tests/test_ibm_repcode.py
